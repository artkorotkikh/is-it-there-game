canisters:
  - name: frontend
    recipe:
      type: "@dfinity/static-site@v0.3.3"
      configuration:
        dir: dist
        build:
          - npm run build
        metadata:
          - name: service:version
            value: "0.8.2"
    settings:
      environment_variables:
        __META_PROJECT: "IS IT THERE YET?"
        __META_NAME: "Game"
        __META_MAIN_CANISTER: "true"
        __META_BASE_URL: "https://z4wnx-uqaaa-aaabz-aadeq-cai.icp.net"
        __META_ICON_PATH: "/favicon.svg?v=0.4.3"
  - name: records
    recipe:
      type: "@dfinity/motoko@v5.0.0"
      configuration:
        metadata:
          - name: service:version
            value: "0.6.1"
    settings:
      environment_variables:
        __META_PROJECT: "IS IT THERE YET?"
        __META_NAME: "Profiles and records"
  - name: rooms
    recipe:
      type: "@dfinity/motoko@v5.0.0"
      configuration:
        metadata:
          - name: service:version
            value: "0.8.0"
    settings:
      environment_variables:
        __META_PROJECT: "IS IT THERE YET?"
        __META_NAME: "Expedition rooms"
  - name: admin
    recipe:
      type: "@dfinity/static-site@v0.3.3"
      configuration:
        dir: dist-admin
        build:
          - npm run admin:build
        metadata:
          - name: service:version
            value: "0.2.0"
    settings:
      environment_variables:
        __META_PROJECT: "IS IT THERE YET?"
        __META_NAME: "Statistics"
networks:
  - name: local
    mode: managed
    gateway:
      port: 0
